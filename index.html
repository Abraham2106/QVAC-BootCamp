<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem('bootcamp.theme')
        var m = localStorage.getItem('bootcamp.uiMode')
        if (m === 'ninja') {
          document.documentElement.dataset.ui = 'ninja'
          document.documentElement.classList.add('ninja', 'dark')
          document.documentElement.dataset.theme = 'dark'
        } else {
          document.documentElement.dataset.ui = 'docs'
          document.documentElement.classList.remove('ninja')
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t
            document.documentElement.classList.toggle('dark', t === 'dark')
          } else {
            document.documentElement.classList.toggle(
              'dark',
              window.matchMedia('(prefers-color-scheme: dark)').matches,
            )
          }
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
