<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem('bootcamp.theme')
        var m = localStorage.getItem('bootcamp.uiMode')
        if (m === 'ninja') {
          document.documentElement.dataset.ui = 'ninja'
          document.documentElement.classList.add('ninja', 'dark')
          document.documentElement.dataset.theme = 'dark'
        } else {
          document.documentElement.dataset.ui = 'docs'
          document.documentElement.classList.remove('ninja')
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t
            document.documentElement.classList.toggle('dark', t === 'dark')
          } else {
            document.documentElement.classList.toggle(
              'dark',
              window.matchMedia('(prefers-color-scheme: dark)').matches,
            )
          }
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bootcamp de sistemas de IA local-first con QVAC: de la primera inferencia offline a una malla de inteligencia distribuida. 12 clases + capstone."
    />
    <meta property="og:image" content="/assets/images/qvac-mark.svg" />
    <title>The Local-First AI Systems Masterclass · QVAC Bootcamp</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/qvac-mark.svg" />
    <link rel="mask-icon" href="/assets/images/qvac-mark.svg" color="#18324B" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Local-First AI Systems Masterclass · QVAC Bootcamp" />
    <meta
      property="og:description"
      content="Bootcamp de sistemas de IA local-first con QVAC: de la primera inferencia offline a una malla de inteligencia distribuida. 12 clases + capstone."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital@0;1&family=Fira+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
